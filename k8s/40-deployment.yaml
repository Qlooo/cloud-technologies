apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-todo
  namespace: cloud-lab2
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-todo
  template:
    metadata:
      labels:
        app: flask-todo
    spec:
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
      containers:
        - name: app
          image: flask-todo:1.0.0
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 5000
          envFrom:
            - configMapRef:
                name: flask-todo-config
          env:
            - name: FLASK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: flask-todo-secret
                  key: FLASK_SECRET_KEY
          volumeMounts:
            - name: data
              mountPath: /app/instance
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: flask-todo-data
