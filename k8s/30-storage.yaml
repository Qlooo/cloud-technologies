apiVersion: v1
kind: PersistentVolume
metadata:
  name: flask-todo-pv
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /data/flask-todo
    type: Directory
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - cloud-lab2-control-plane
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: flask-todo-data
  namespace: cloud-lab2
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  volumeName: flask-todo-pv
  resources:
    requests:
      storage: 1Gi
